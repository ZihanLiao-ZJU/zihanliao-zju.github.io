# Public repositories grouped by primary research area; each repository appears once.

- id: reliability-estimation
  title: Reliability Estimation
  tools:
  - name: SeMIS for Reliability Estimation
    language: MATLAB · Python
    description: Sequential multiple importance sampling for estimating small failure probabilities, including in high-dimensional
      problems, with optional single-run CoV bounds and twelve benchmark examples.
    paper: Mechanical Systems and Signal Processing, 2026
    repositories:
    - label: MATLAB
      repo: ZihanLiao-ZJU/Sequential-multiple-importance-sampling-for-Reliability-Estimation
    - label: Python
      repo: ZihanLiao-ZJU/Sequential-multiple-importance-sampling-for-Reliability-Estimation-Python
  - name: Generalized Subset Simulation with MIS (GSuS-MIS)
    language: MATLAB · Python
    description: Generalized subset simulation with multiple importance sampling for reliability estimation with multiple
      failure events, with two numerical examples.
    paper: Computers & Structures, 2025
    repositories:
    - label: MATLAB
      repo: ZihanLiao-ZJU/Generalized-Subset-Simulation-with-Multiple-Importance-Sampling
    - label: Python
      repo: ZihanLiao-ZJU/Generalized-Subset-Simulation-with-Multiple-Importance-Sampling-Python
  - name: Relaxed Subset Simulation (ReSuS)
    language: MATLAB · Python
    description: Relaxed subset simulation with hybrid intermediate domains and the original sequential probability-product
      estimator for reliability estimation, with numerical examples A–C.
    paper: Reliability Engineering & System Safety, 2025
    repositories:
    - label: MATLAB
      repo: ZihanLiao-ZJU/Relaxed-Subset-Simulation
    - label: Python
      repo: ZihanLiao-ZJU/Relaxed-Subset-Simulation-Python
- id: bayesian-updating
  title: Bayesian Updating
  tools:
  - name: Subset Simulation for Bayesian Updating
    language: MATLAB · Python
    description: Treats the likelihood as a limit-state function and uses subset simulation to estimate the Bayesian evidence,
      with a CoV correction for correlated Markov chain samples, and to draw posterior samples.
    paper: Mechanical Systems and Signal Processing, 2025
    repositories:
    - label: MATLAB
      repo: ZihanLiao-ZJU/Subset-Simulation-for-Bayesian-Updating
    - label: Python
      repo: ZihanLiao-ZJU/Subset-Simulation-for-Bayesian-Updating-Python
  - name: SeMIS for Multimodal Bayesian Inference
    language: MATLAB · Python
    description: Softly truncated, prior-based proposal sequences combined through multiple importance sampling for Bayesian
      evidence estimation and posterior sampling with multimodal, high-dimensional posteriors.
    paper: Mechanical Systems and Signal Processing, 2026
    repositories:
    - label: MATLAB
      repo: ZihanLiao-ZJU/Sequential-multiple-importance-sampling-for-multimodal-Bayesian-inference
    - label: Python
      repo: ZihanLiao-ZJU/Sequential-multiple-importance-sampling-for-multimodal-Bayesian-inference-Python
